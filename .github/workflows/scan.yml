name: Container Security Scan

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: snapcast-runner
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lollonet/snapmulti-server
          - image: lollonet/snapmulti-airplay
          - image: lollonet/snapmulti-mpd
          - image: lollonet/snapmulti-metadata
          - image: lollonet/snapmulti-tidal
            platform: linux/arm64
          - image: lollonet/snapclient-pi
            platform: linux/arm64
          - image: lollonet/snapclient-pi-visualizer
            platform: linux/arm64
          - image: lollonet/snapclient-pi-fb-display
            platform: linux/arm64
          # go-librespot: upstream image scanned separately below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull image (cross-platform if needed)
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform || 'linux/amd64' }}
        run: docker pull --platform "$PLATFORM" "$IMAGE:latest"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ matrix.image }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: '${{ matrix.image }}'

  scan-upstream:
    runs-on: snapcast-runner
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve runtime go-librespot image
        id: runtime-image
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -nE 's/^[[:space:]]*image:[[:space:]]*(ghcr.io\/devgianlu\/go-librespot:[^[:space:]]+).*/\1/p' docker-compose.yml | head -n 1)
          [[ "$image" =~ ^ghcr\.io/devgianlu/go-librespot:v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Scan go-librespot (Spotify Connect)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 # v0.36.0
        with:
          image-ref: '${{ steps.runtime-image.outputs.image }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'go-librespot'
