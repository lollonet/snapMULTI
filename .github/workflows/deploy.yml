name: Deploy to Home Server

on:
  workflow_dispatch:
    # Manual dispatch: HOST comes from the HOST_PI_SERVER repo-level secret (environment: still applies for protection rules).
    inputs:
      environment_name:
        description: 'Target environment'
        required: false
        default: 'pi-server'
  workflow_call:
    inputs:
      environment_name:
        type: string
        required: true
    secrets:
      HOST:
        required: true
      USER:
        required: true
      SSH_KEY:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: snapcast-runner
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-compose.yml bind-mounts these repo files into the containers.
      # Shipping only the compose file left the device running a new compose
      # against old (or missing) configs / bind-mounted scripts.
      - name: Copy docker-compose.yml and bind-mounted files
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
        run: |
          set -euo pipefail
          FILES=(
            docker-compose.yml
            config
            docker/metadata-service/metadata-service.py
            scripts/common/container-manifest.txt
            scripts/tidal
          )
          for f in "${FILES[@]}"; do
            if [[ ! -e "$f" ]]; then
              echo "ERROR: $f missing from checkout"
              exit 1
            fi
          done
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS=(-i "$KEY_FILE" -o StrictHostKeyChecking=accept-new)
          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${HOST}" "rm -rf /tmp/snapmulti-deploy && mkdir -p /tmp/snapmulti-deploy"
          tar -cf - "${FILES[@]}" \
            | ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${HOST}" "tar -xf - -C /tmp/snapmulti-deploy"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@2ead5e36573838044bfdd81083b27846db753b4c # v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_VERSION: ${{ github.ref_name }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DEPLOY_VERSION
          script: |
            set -euo pipefail

            cd /opt/snapmulti || { echo "ERROR: Directory not found"; exit 1; }

            echo "Deploying version: ${DEPLOY_VERSION}"

            # Fail fast (before touching the running stack) if the upload
            # is incomplete.
            STAGE=/tmp/snapmulti-deploy
            DEPLOY_FILES="docker-compose.yml config docker/metadata-service/metadata-service.py scripts/common/container-manifest.txt scripts/tidal"
            for f in $DEPLOY_FILES; do
              if [ ! -e "$STAGE/$f" ]; then
                echo "ERROR: $STAGE/$f missing -- upload incomplete, aborting (running stack untouched)"
                exit 1
              fi
            done

            echo "Logging in to Docker Hub..."
            if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "ERROR: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is empty."
              echo "Ensure both are configured as repository secrets."
              exit 1
            fi
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || { echo "ERROR: Docker Hub login failed"; exit 1; }

            echo "Updating docker-compose.yml and bind-mounted files..."
            for f in $DEPLOY_FILES; do
              sudo mkdir -p "/opt/snapmulti/$(dirname "$f")"
              sudo cp -R "$STAGE/$f" "/opt/snapmulti/$(dirname "$f")/"
            done
            rm -rf "$STAGE"

            # Tidal Connect (ARM-only) is on by default; TIDAL_ENABLED=false
            # in .env is the explicit opt-out (same rule as deploy.sh).
            if [ "$(uname -m)" = "aarch64" ]; then
              TIDAL_ENABLED_VAL=$(grep -m1 '^TIDAL_ENABLED=' .env 2>/dev/null | cut -d= -f2- | tr -d "\"' \r" | tr '[:upper:]' '[:lower:]' || true)
              CUR_PROFILES=$(grep -m1 '^COMPOSE_PROFILES=' .env 2>/dev/null | cut -d= -f2- | tr -d "\"' \r" || true)
              case "$TIDAL_ENABLED_VAL" in
                false|0|no|off)
                  NEW_PROFILES=$(printf '%s' "$CUR_PROFILES" | tr ',' '\n' | grep -vx 'tidal' | grep -v '^$' | paste -sd, - || true)
                  if grep -q '^COMPOSE_PROFILES=' .env 2>/dev/null && [ "$NEW_PROFILES" != "$CUR_PROFILES" ]; then
                    sed -i "s/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=${NEW_PROFILES}/" .env
                    echo "TIDAL_ENABLED=false: removed tidal from COMPOSE_PROFILES"
                  fi
                  docker rm -f tidal-connect >/dev/null 2>&1 || true
                  ;;
                *)
                  echo "Ensuring COMPOSE_PROFILES=tidal on ARM (migration from pre-v0.3.5 .env)..."
                  if ! grep -q "^COMPOSE_PROFILES=" .env 2>/dev/null; then
                    echo "COMPOSE_PROFILES=tidal" >> .env
                    echo "Migrated .env: added COMPOSE_PROFILES=tidal"
                  elif ! printf ',%s,' "$CUR_PROFILES" | grep -q ',tidal,'; then
                    sed -i "s/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=${CUR_PROFILES:+${CUR_PROFILES},}tidal/" .env
                    echo "Migrated .env: added tidal to existing COMPOSE_PROFILES"
                  fi
                  ;;
              esac
            fi

            echo "Creating required directories..."
            mkdir -p mympd/workdir mympd/cachedir audio artwork

            # Pull BEFORE touching the running stack: if the pull fails the
            # old containers and images stay in place and keep playing.
            # Only dangling layers are pruned here (frees tmpfs on
            # overlayroot) -- never images the running stack uses.
            docker image prune -f || true
            echo "Pulling latest images..."
            # COMPOSE_PROFILES in .env controls ARM-only services (tidal-connect)
            docker compose pull || { echo "ERROR: docker compose pull failed -- running stack left untouched"; exit 1; }

            if mountpoint -q /media/root-ro 2>/dev/null; then
                echo "Baking deployment to SD card lower layer..."
                BAKE_DIR=$(mktemp -d /tmp/snapmulti-bake-XXXXX)
                cleanup() {
                    sudo umount "$BAKE_DIR" 2>/dev/null || true
                    rmdir "$BAKE_DIR" 2>/dev/null || true
                    sudo sync
                }
                trap cleanup EXIT

                sudo mount --bind /media/root-ro "$BAKE_DIR"
                sudo mount -o remount,rw "$BAKE_DIR"

                # Persist config
                sudo rsync -a \
                    /opt/snapmulti/.env \
                    /opt/snapmulti/docker-compose.yml \
                    "$BAKE_DIR/opt/snapmulti/"

                # Persist the bind-mounted files shipped with this compose
                # file, so the lower layer stays consistent with it.
                for f in $DEPLOY_FILES; do
                    [ "$f" = docker-compose.yml ] && continue
                    sudo mkdir -p "$BAKE_DIR/opt/snapmulti/$(dirname "$f")"
                    sudo rsync -a "/opt/snapmulti/$f" "$BAKE_DIR/opt/snapmulti/$(dirname "$f")/"
                done

                # Persist myMPD user state (UI customizations, playlists)
                sudo rsync -a /opt/snapmulti/mympd/workdir/ \
                    "$BAKE_DIR/opt/snapmulti/mympd/workdir/"

                # Persist MPD database (avoids full NFS/SMB rescan on reboot; incremental update only)
                if [ -f /opt/snapmulti/mpd/data/mpd.db ]; then
                    sudo mkdir -p "$BAKE_DIR/opt/snapmulti/mpd/data"
                    sudo rsync -a /opt/snapmulti/mpd/data/mpd.db \
                        "$BAKE_DIR/opt/snapmulti/mpd/data/"
                fi

                # Persist Docker image index (always sync, tiny)
                sudo rsync -a /var/lib/docker/image/ \
                    "$BAKE_DIR/var/lib/docker/image/"

                # Persist new image layers only (fuse-overlayfs uses user.overlay.* xattrs)
                sudo rsync -aX --ignore-existing /var/lib/docker/fuse-overlayfs/ \
                    "$BAKE_DIR/var/lib/docker/fuse-overlayfs/"

                # Sanity-check that the bake actually persisted the .env (rsync failure
                # would already have exited via set -e, but guard against an empty file).
                if [[ ! -s "$BAKE_DIR/opt/snapmulti/.env" ]]; then
                    echo "ERROR: Bake verification failed -- baked .env is empty or missing"
                    exit 1
                fi

                sudo sync
                echo "Bake complete (${DEPLOY_VERSION}) -- changes will survive reboot."
            else
                echo "WARNING: /media/root-ro not mounted -- skipping bake (non-overlayroot target)"
            fi

            echo "Recreating app containers..."
            # up -d recreates only containers whose image/config changed;
            # --remove-orphans drops services no longer in the compose file.
            docker compose up -d --remove-orphans || { echo "ERROR: docker compose up failed"; exit 1; }

            echo "Pruning images replaced by this deploy..."
            docker image prune -f || true

            echo "Verifying deployment..."
            sleep 5
            docker ps --format "table {{.Names}}\t{{.Status}}"

            echo "Deployment complete (version: ${DEPLOY_VERSION})"
